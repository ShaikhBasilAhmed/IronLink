[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "ironlink-pin-service"
version = "1.0.0"
description = "IronLink dynamic SSL pin distribution service (ECDSA P-256, Vault AppRole + KV v2)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "gunicorn>=22.0,<24.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "hvac>=2.3,<3.0",
    "cryptography>=42,<46",
    "slowapi>=0.1.9,<0.2",
    "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
