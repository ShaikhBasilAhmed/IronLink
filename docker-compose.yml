# Reference compose for a single node. In production run >=2 replicas behind a
# load balancer / Cloudflare origin, or use the Kubernetes manifests instead.
services:
  ironlink:
    build: .
    image: ironlink-pin-service:1.0.0
    restart: unless-stopped
    env_file: .env
    ports:
      - "8443:8443"
    volumes:
      # Internal CA bundle, if VAULT_CACERT points into the container:
      # - /etc/pki/example-ca.pem:/etc/pki/example-ca.pem:ro
      #
      # TLS cert + private key for this service's own HTTPS listener. Set
      # TLS_CERT_FILE / TLS_KEY_FILE in .env to the paths on the RIGHT (container-side).
      # Mount read-only; the host-side key file should be chmod 600, root-owned.
      - /etc/ironlink/tls/fullchain.pem:/etc/ironlink/tls/fullchain.pem:ro
      - /etc/ironlink/tls/privkey.pem:/etc/ironlink/tls/privkey.pem:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import os,ssl,urllib.request,sys; scheme='https' if os.getenv('TLS_CERT_FILE') and os.getenv('TLS_KEY_FILE') else 'http'; ctx=ssl._create_unverified_context() if scheme=='https' else None; sys.exit(0 if urllib.request.urlopen(f'{scheme}://127.0.0.1:8443/readyz',timeout=2,context=ctx).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
